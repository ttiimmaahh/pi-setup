# CH57x macropad transport adapter for Ghostty 1.3+.
#
# The controller emits F13 and F16-F19 as uncommon, stable HID identities.
# F14/F15 are skipped because macOS reserves them for display-brightness
# controls. Ghostty consumes the remaining local keys and sends explicit xterm
# sequences for documented Ctrl+Alt+Shift navigation keys. This avoids global
# F5-F9 behavior and Claude Code's non-dispatched function-key user bindings.
#
# Hardware identity -> application key -> intended role
# F13 -> Ctrl+Alt+Shift+Up -> voice toggle (Pi)
# F16 -> Ctrl+Alt+Shift+Down -> plan / mode
# F17 -> Ctrl+Alt+Shift+Left -> knob counterclockwise
# F18 -> Ctrl+Alt+Shift+Delete -> knob press
# F19 -> Ctrl+Alt+Shift+Right -> knob clockwise
keybind = f13=csi:1;8A
keybind = f16=csi:1;8B
keybind = f17=csi:1;8D
keybind = f18=csi:3;8~
keybind = f19=csi:1;8C
