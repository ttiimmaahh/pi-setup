# Universal-identity CH57x 3x2 + knob profile for Pi and Claude Code.
# Normal orientation: six buttons on the left, knob on the right.
#
# The five custom controls emit uncommon HID function keys. A terminal adapter
# translates those identities into documented application chords. F14/F15 are
# skipped because macOS reserves them for display-brightness controls before a
# terminal can bind them. The standard Submit/Escape/Interrupt/Details buttons
# retain their ordinary portable meanings.
model: ch57x-2
orientation: normal
rows: 3
columns: 2
knobs: 1

# The connected unit has no physical layer switch. Program all three stored
# mappings identically so behavior never depends on an unknown active layer.
layers:
  - buttons:
      - ["f13", "f16"]
      - ["enter", "escape"]
      - ["ctrl-c", "ctrl-o"]
    knobs:
      - ccw: "f17"
        press: "f18"
        cw: "f19"

  - buttons:
      - ["f13", "f16"]
      - ["enter", "escape"]
      - ["ctrl-c", "ctrl-o"]
    knobs:
      - ccw: "f17"
        press: "f18"
        cw: "f19"

  - buttons:
      - ["f13", "f16"]
      - ["enter", "escape"]
      - ["ctrl-c", "ctrl-o"]
    knobs:
      - ccw: "f17"
        press: "f18"
        cw: "f19"
